name: Build Mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Template
        run: |
          unzip zenith-launcher-tastatur-fix-template-26.2.zip -d extracted_mod

      - name: Program Keyboard Fix Code
        run: |
          GRADLE_DIR=$(find extracted_mod -name "build.gradle" -exec dirname {} \;)
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          
          mkdir -p $GRADLE_DIR/src/main/java/com/example/chatfix
          mkdir -p $GRADLE_DIR/src/main/resources
          
          # Hier wird die fertige Mod vollautomatisch programmiert
          cat << 'EOF' > $GRADLE_DIR/src/main/java/com/example/chatfix/ChatFixMod.java
          package com.example.chatfix;
          
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents;
          
          public class ChatFixMod implements ClientModInitializer {
              private long lastTime = 0;
              private int lastKey = -1;
          
              @Override
              public void onInitializeClient() {
                  ScreenEvents.BEFORE_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      ScreenKeyboardEvents.allowKeyPress(screen).register((thisScreen, key, scancode, modifiers) -> {
                          long currentTime = System.currentTimeMillis();
                          if (key == lastKey && (currentTime - lastTime) < 45) {
                              lastTime = currentTime;
                              return false; 
                          }
                          lastKey = key;
                          lastTime = currentTime;
                          return true;
                      });
                  });
              }
          }
          EOF

          # Schreibt die Konfiguration
          cat << 'EOF' > $GRADLE_DIR/src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "zenith_keyboard_fix",
            "name": "Zenith Keyboard Fix",
            "version": "1.0.0",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.example.chatfix.ChatFixMod"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.26.2",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      # Wir installieren Gradle 9.0, um Java 25 voll zu unterstützen
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0'
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build Mod with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: "**/build/libs/*.jar"
