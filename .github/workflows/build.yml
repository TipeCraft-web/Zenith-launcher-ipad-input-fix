name: Build Mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Program Keyboard Fix Code
        run: |
          mkdir -p src/main/java/com/example/chatfix
          mkdir -p src/main/resources
          
          # Schreibe den Java-Code
          cat << 'EOF' > src/main/java/com/example/chatfix/ChatFixMod.java
          package com.example.chatfix;
          
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents;
          
          public class ChatFixMod implements ClientModInitializer {
              private long lastTime = 0;
              private int lastKey = -1;
          
              @Override
              public void onInitializeClient() {
                  ScreenEvents.BEFORE_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      ScreenKeyboardEvents.allowKeyPress(screen).register((thisScreen, key, scancode, modifiers) -> {
                          long currentTime = System.currentTimeMillis();
                          if (key == lastKey && (currentTime - lastTime) < 45) {
                              lastTime = currentTime;
                              return false; 
                          }
                          lastKey = key;
                          lastTime = currentTime;
                          return true;
                      });
                  });
              }
          }
          EOF

          # Schreibe die fabric.mod.json
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "zenith_keyboard_fix",
            "name": "Zenith Keyboard Fix",
            "version": "1.0.0",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.example.chatfix.ChatFixMod"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.26.2",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle and Build
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: build
          build-root-directory: '.'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: "**/build/libs/*.jar"
