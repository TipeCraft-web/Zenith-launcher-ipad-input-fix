name: Build Mod
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Template
        run: |
          unzip zenith-launcher-tastatur-fix-template-26.2.zip -d extracted_mod
          # Verschiebe alle Dateien ins Hauptverzeichnis
          mv extracted_mod/*/* . 2>/dev/null || mv extracted_mod/* .

      - name: Inject Keyboard Fix Code
        run: |
          # Findet die Haupt-Java-Datei und überschreibt sie mit dem Fix-Code
          JAVA_FILE=$(find src/main/java -name "*ModInitializer.java" -o -name "*Mod.java" | head -n 1)
          PACKAGE_LINE=$(grep "package " $JAVA_FILE)
          
          cat << 'EOF' > $JAVA_FILE
          $PACKAGE_LINE
          
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents;
          
          public class ChatFixMod implements ClientModInitializer {
              private long lastTime = 0;
              private int lastKey = -1;
          
              @Override
              public void onInitializeClient() {
                  ScreenEvents.BEFORE_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      ScreenKeyboardEvents.allowKeyPress(screen).register((thisScreen, key, scancode, modifiers) -> {
                          long currentTime = System.currentTimeMillis();
                          if (key == lastKey && (currentTime - lastTime) < 45) {
                              lastTime = currentTime;
                              return false; 
                          }
                          lastKey = key;
                          lastTime = currentTime;
                          return true;
                      });
                  });
              }
          }
          EOF
          
          # Fix für Paketnamen in der Datei
          sed -i "s/\$PACKAGE_LINE/$PACKAGE_LINE/g" $JAVA_FILE

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: build/libs/*.jar
