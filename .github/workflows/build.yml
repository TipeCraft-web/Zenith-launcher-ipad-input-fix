name: Build Mod
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Template
        run: |
          unzip zenith-launcher-tastatur-fix-template-26.2.zip -d extracted_mod

      - name: Program Keyboard Fix Code
        run: |
          GRADLE_DIR=$(find extracted_mod -name "build.gradle" -exec dirname {} \;)
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          
          mkdir -p $GRADLE_DIR/src/main/java/com/example/chatfix
          mkdir -p $GRADLE_DIR/src/main/resources
          
          cat << 'EOF' > $GRADLE_DIR/src/main/java/com/example/chatfix/ChatFixMod.java
          package com.example.chatfix;
          
          import net.fabricmc.api.ClientModInitializer;
          import java.lang.reflect.Method;
          
          public class ChatFixMod implements ClientModInitializer {
              private static long lastTime = 0;
              private static String lastString = "";
          
              @Override
              public void onInitializeClient() {
                  try {
                      Class<?> screenEventsClass = Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenEvents");
                      Class<?> screenKeyboardEventsClass = Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents");
                      
                      java.lang.reflect.Field beforeInitField = screenEventsClass.getField("BEFORE_INIT");
                      Object beforeInitEvent = beforeInitField.get(null);
                      
                      Method registerBeforeInit = beforeInitEvent.getClass().getMethod("register", Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$BeforeInit"));
                      
                      Object beforeInitProxy = java.lang.reflect.Proxy.newProxyInstance(
                          ChatFixMod.class.getClassLoader(),
                          new Class<?>[]{Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$BeforeInit")},
                          (proxy, method, args) -> {
                              if (method.getName().equals("beforeInit")) {
                                  Object screen = args;
                                  try {
                                      // Wir fangen das allgemeine Tastatur-Event für den gesamten Bildschirm ab
                                      Method allowKeyPressMethod = screenKeyboardEventsClass.getMethod("allowKeyPress", Class.forName("net.minecraft.class_437"));
                                      Object allowKeyPressEvent = allowKeyPressMethod.invoke(null, screen);
                                      
                                      Method registerAllowKey = allowKeyPressEvent.getClass().getMethod("register", Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents$AllowKeyPress"));
                                      
                                      Object allowKeyProxy = java.lang.reflect.Proxy.newProxyInstance(
                                          ChatFixMod.class.getClassLoader(),
                                          new Class<?>[]{Class.forName("net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents$AllowKeyPress")},
                                          (kProxy, kMethod, kArgs) -> {
                                              long currentTime = System.currentTimeMillis();
                                              // Wenn der zeitliche Abstand extrem kurz ist, blockieren wir jeglichen weiteren Input für dieses Fenster!
                                              if ((currentTime - lastTime) < 45) {
                                                  lastTime = currentTime;
                                                  return false; 
                                              }
                                              lastTime = currentTime;
                                              return true;
                                          }
                                      );
                                      registerAllowKey.invoke(allowKeyPressEvent, allowKeyProxy);
                                  } catch (Exception ignored) {}
                              }
                              return null;
                          }
                      );
                      
                      registerBeforeInit.invoke(beforeInitEvent, beforeInitProxy);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > $GRADLE_DIR/src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "zenith_keyboard_fix",
            "name": "Zenith Keyboard Fix",
            "version": "1.0.0",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.example.chatfix.ChatFixMod"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "*",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build Mod with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: "**/build/libs/*.jar"
